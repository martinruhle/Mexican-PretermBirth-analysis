name: R-CI

# Reproducible CI for the ptbpredict research compendium:
#   1. restore the exact package set from renv.lock (R 4.4.2, Bioconductor 3.20)
#   2. install the package
#   3. run the FULL testthat suite, INCLUDING the slow end-to-end no-leakage
#      permutation test (#8) — gated on PTB_RUN_SLOW_TESTS, set here on purpose
#   4. best-effort smoke-run of the pipeline over data/example/ (non-blocking)

on:
  push:
    branches: [refactor/compendium, master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04   # pinned: the P3M binary URL below is codename-specific (noble)

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      RENV_PATHS_ROOT: ~/.cache/R/renv
      # CRITICAL, NON-NEGOTIABLE: activates the no-leakage permutation test (#8,
      # tests/testthat/test-leakage-permutation.R). Without it that test SKIPS and
      # the project's core no-leakage guarantee goes dormant (green by omission).
      PTB_RUN_SLOW_TESTS: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up R 4.4.2
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.2'
          use-public-rspm: true

      - name: Set up pandoc (for the example smoke-run render)
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install system dependencies (Bioconductor + source builds)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglpk-dev libxml2-dev zlib1g-dev libbz2-dev liblzma-dev \
            libgsl-dev libcurl4-openssl-dev libssl-dev libudunits2-dev \
            libfontconfig1-dev libharfbuzz-dev libfribidi-dev \
            libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev

      - name: Cache renv library
        uses: actions/cache@v5
        with:
          path: ${{ env.RENV_PATHS_ROOT }}
          key: renv-noble-R4.4.2-${{ hashFiles('renv.lock') }}
          restore-keys: |
            renv-noble-R4.4.2-

      - name: Restore packages (renv)
        run: |
          # renv is bootstrapped by the project .Rprofile (renv/activate.R).
          # setup-r (use-public-rspm) sets RENV_CONFIG_REPOS_OVERRIDE to the Posit
          # Package Manager noble binary repo, so CRAN packages install prebuilt.
          # The lock pins clock 0.7.3 (superseded by 0.7.4), so clock is built from
          # source -- which now succeeds and LOADS because the lock pins tzdb 0.5.0
          # (bumped from 0.4.0, proven result-neutral), satisfying clock's
          # LinkingTo: tzdb (>= 0.5.0). Bioconductor is built from source (the
          # system deps above cover it).
          Rscript -e 'renv::restore(prompt = FALSE)'

      - name: Install ptbpredict
        run: |
          # Install the local package into the (renv-active) project library.
          # renv::install(".") avoids capturing renv's stdout into a path.
          Rscript -e 'renv::install(".", prompt = FALSE)'

      - name: Run test suite (includes no-leakage permutation test #8)
        run: |
          Rscript -e 'testthat::test_dir("tests/testthat", stop_on_failure = TRUE)'

      - name: Smoke-run example pipeline (non-blocking)
        continue-on-error: true
        env:
          PTB_PROFILE: example
        run: |
          Rscript -e '
            tryCatch(
              rmarkdown::render("analysis/integrated_preterm_prediction_workflow.Rmd",
                                quiet = TRUE),
              error = function(e)
                message("example smoke-run non-fatal (not a CI gate): ",
                        conditionMessage(e))
            )
          '
